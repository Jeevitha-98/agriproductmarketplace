<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | AgriMarket</title>
    <link rel="stylesheet" href="404-styles.css">
    <!-- Font Awesome for clean organic vectors -->
    <link rel="stylesheet" href="https://cloudflare.com">
</head>
<body>

    <!-- Decorative Organic Leaf Blade Vectors (Bottom Corners) -->
    <div class="leaf-blade corner-left">
        <svg viewBox="0 0 100 100" fill="currentColor">
            <path d="M10,100 C30,70 60,60 100,60 C80,80 40,90 10,100 Z"></path>
            <path d="M0,100 C15,50 45,30 85,30 C65,60 30,80 0,100 Z"></path>
            <path d="M0,100 C5,30 25,10 65,10 C45,40 15,70 0,100 Z"></path>
            <path d="M0,100 C-5,15 10,0 45,0 C30,30 10,60 0,100 Z"></path>
        </svg>
    </div>
    
    <div class="leaf-blade corner-right">
        <svg viewBox="0 0 100 100" fill="currentColor">
            <path d="M90,100 C70,70 40,60 0,60 C20,80 60,90 90,100 Z"></path>
            <path d="M100,100 C85,50 55,30 15,30 C35,60 70,80 100,100 Z"></path>
            <path d="M100,100 C95,30 75,10 35,10 C55,40 85,70 100,100 Z"></path>
            <path d="M100,100 C105,15 90,0 55,0 C70,30 90,60 100,100 Z"></path>
        </svg>
    </div>

    <!-- Main Central Presentation Wrapper -->
    <main class="error-wrapper">
        <h1 class="error-code">404</h1>
        <h2 class="error-title">Oops! Page Not Found</h2>
        <p class="error-desc">The page you're looking for doesn't exist, has been moved, or the URL may be incorrect. Let's get you back on track to the harvest.</p>
        
        <!-- Interactive Navigation Options Row -->
        <div class="action-btn-row">
            <button class="btn btn-back" onclick="navigateBackToSection()">
                ← &nbsp;Go Back
            </button>
            <button class="btn btn-home" onclick="navigateHome()">
                <i class="fa-solid fa-house-chimney-crack"></i> Return Home
            </button>
        </div>
    </main>

  <style>
    /* Agriculture Marketplace Clean White & Green Palette Archetype */
:root {
    --bg-main: #FFFFFF;
    --text-primary: #000000;
    --text-muted: #555555;
    --agri-green: #1B5E20; /* Deep harvest marketplace emerald green */
    --agri-green-hover: #144316;
    --border-color: #000000;
    --btn-radius: 6px;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

body {
    background-color: var(--bg-main);
    color: var(--text-primary);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    position: relative;
    overflow: hidden;
}

/* Central Block Frame Alignment */
.error-wrapper {
    text-align: center;
    max-width: 580px;
    width: 100%;
    z-index: 10;
    padding-bottom: 60px; /* Counter-weights corner graphical footprints visually */
}

.error-code {
    font-size: clamp(100px, 20vw, 180px);
    font-weight: 800;
    line-height: 1;
    letter-spacing: -0.04em;
    margin-bottom: 12px;
}

.error-title {
    font-size: clamp(22px, 4vw, 32px);
    font-weight: 700;
    margin-bottom: 16px;
    letter-spacing: -0.01em;
}

.error-desc {
    color: var(--text-muted);
    font-size: clamp(14px, 2.8vw, 15px);
    line-height: 1.6;
    margin-bottom: 36px;
    padding: 0 10px;
}

/* Functional Buttons Navigation Layout */
.action-btn-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
}

.btn {
    padding: 12px 28px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    border-radius: var(--btn-radius);
    transition: all 0.2s ease-in-out;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    height: 46px;
    text-decoration: none;
}

/* Left Transparent Border Style Button */
.btn-back {
    background-color: transparent;
    color: var(--text-primary);
    border: 1px solid var(--border-color);
}

.btn-back:hover {
    background-color: rgba(0, 0, 0, 0.05);
}

/* Right Primary Solid Agri Green Button */
.btn-home {
    background-color: var(--agri-green);
    color: #FFFFFF;
    border: none;
}

.btn-home:hover {
    background-color: var(--agri-green-hover);
}

/* SVG Vector Leaves Layout Placement */
.leaf-blade {
    position: absolute;
    bottom: -10px;
    width: clamp(150px, 30vw, 320px);
    height: auto;
    color: #000000; /* Replicates black organic blades from image */
    pointer-events: none;
    user-select: none;
    z-index: 1;
}

.corner-left {
    left: -20px;
}

.corner-right {
    right: -20px;
}

/* Absolute Media Queries for Mobile Responsiveness */
@media (max-width: 480px) {
    body {
        padding: 16px;
    }
    
    .action-btn-row {
        flex-direction: column;
        width: 100%;
        gap: 12px;
    }
    
    .btn {
        width: 100%;
    }
    
    .leaf-blade {
        width: 130px; /* Scaled down slightly to prevent clipping on mini viewports */
    }
}

  </style>

<script>
function navigateBackToSection() {

    const savedReturn = sessionStorage.getItem("agri404Return");

    if (savedReturn) {

        try {

            const data = JSON.parse(savedReturn);

            if (data.page && data.sectionId) {

                window.location.href =
                    data.page + "#" + encodeURIComponent(data.sectionId);

                return;
            }

        } catch (error) {

            console.error(
                "AgriMart 404 return error:",
                error
            );

        }

    }


    /* Fallback */

    if (document.referrer) {

        window.history.back();

    } else {

        window.location.href = "index.html";

    }

}
</script>
</body>
</html>
